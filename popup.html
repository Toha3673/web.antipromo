<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>АнтиПромо</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #fff;
      color: #333;
    }

    .header {
      background: linear-gradient(135deg, #FC3F1D, #E0351A);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
    }

    .header-text h1 {
      font-size: 16px;
      font-weight: 700;
    }

    .header-text p {
      font-size: 11px;
      opacity: 0.85;
    }

    .content {
      padding: 16px 20px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 10px 12px;
      background: #f5f5f5;
      border-radius: 8px;
      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4CAF50;
      flex-shrink: 0;
    }

    .status-dot.off {
      background: #ccc;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat-card {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }

    .stat-card .number {
      font-size: 22px;
      font-weight: 700;
      color: #FC3F1D;
    }

    .stat-card .label {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-top: 1px solid #eee;
      font-size: 13px;
    }

    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      cursor: pointer;
    }

    .toggle-switch input {
      display: none;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 22px;
      transition: 0.3s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 2px;
      top: 2px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }

    .toggle-switch input:checked + .toggle-slider {
      background: #FC3F1D;
    }

    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(18px);
    }

    .footer {
      padding: 10px 20px;
      border-top: 1px solid #eee;
      font-size: 11px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-text">
      <h1>АнтиПромо</h1>
      <p>Меньше рекламы при поиске</p>
    </div>
  </div>

  <div class="content">
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Проверка...</span>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="number" id="blockedCount">0</div>
        <div class="label">скрыто результатов</div>
      </div>
      <div class="stat-card">
        <div class="number" id="pagesCount">0</div>
        <div class="label">проверено страниц</div>
      </div>
    </div>

    <div class="toggle">
      <span>Расширение активно</span>
      <label class="toggle-switch">
        <input type="checkbox" id="enabledToggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <div class="footer">
    v1.0.0 - скрывает результаты с пометкой «промо»
  </div>

  <script src="popup.js"></script>
</body>
</html>
